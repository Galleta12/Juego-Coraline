<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>ayuda</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Una expedición minera cuestionablemente profesional.">
<meta name="color-scheme" content="dark">
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' fill='%2308060e'/><path d='M4 6h8l-4 6z' fill='%234ee0d8'/><path d='M4 6l2-2h4l2 2z' fill='%2380f2ec'/></svg>">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Grenze+Gotisch:wght@400;600&family=Crimson+Pro:ital,wght@0,400;0,600;1,400&display=swap">

<style>
  :root{
    --void:#08060e; --ink:#140d1f; --bruise:#2b1a3f;
    --thread:#7c4a86; --bone:#e6dccb; --dim:#8d8497;
    --gold:#d9a441; --diamond:#4ee0d8;
    --display:"Grenze Gotisch","Iowan Old Style",Georgia,serif;
    --body:"Crimson Pro",Georgia,serif;
  }
  *,*::before,*::after{box-sizing:border-box}
  /* El fondo va tambien en <html>, no solo en <body>.
     El lienzo se centra y deja franjas a los lados cuando la ventana no
     tiene la proporcion del juego; si <html> se queda con el blanco por
     defecto del navegador, esas franjas salen blancas. */
  html{background:var(--void)}
  html,body{height:100%}
  body{
    margin:0; background:var(--void); color:var(--bone);
    font-family:var(--body); overflow:hidden;
    -webkit-user-select:none; user-select:none;
    -webkit-font-smoothing:antialiased;
  }
  body::before{
    content:""; position:fixed; inset:0; pointer-events:none; z-index:0;
    background:
      radial-gradient(120% 90% at 50% 0%, rgba(43,26,63,.5), transparent 62%),
      radial-gradient(100% 80% at 50% 110%, rgba(124,74,134,.18), transparent 66%);
  }

  /* Un único responsable del centrado: este flex. Phaser va en
     NO_CENTER, así no compiten. */
  #game{
    position:fixed; inset:0; z-index:1; overflow:hidden;
    display:flex; align-items:center; justify-content:center;
  }
  #game canvas{display:block; margin:0}

  .gate{
    position:fixed; inset:0; z-index:10; display:none;
    flex-direction:column; align-items:center; justify-content:center;
    gap:1.4rem; padding:2rem; text-align:center; background:var(--void);
  }
  .gate[data-on]{display:flex}

  .eyebrow{
    font-family:var(--body); font-size:.72rem; letter-spacing:.34em;
    text-transform:uppercase; color:var(--thread); margin:0;
  }
  .headline{
    font-family:var(--display); font-weight:600;
    font-size:clamp(1.4rem,5vw,2.2rem); letter-spacing:.03em;
    color:var(--bone); margin:0; line-height:1.2; max-width:20ch;
    text-wrap:balance;
  }
  .body{font-size:1rem; line-height:1.8; color:var(--dim); max-width:34ch; margin:0}
  .meta{font-size:.72rem; letter-spacing:.2em; color:var(--thread); opacity:.7; margin:0}

  /* Firma: una costura que se cose sola */
  .stitch{width:min(280px,70vw); height:2px; position:relative; overflow:hidden}
  .stitch::after{
    content:""; position:absolute; inset:0;
    background:repeating-linear-gradient(90deg, var(--thread) 0 7px, transparent 7px 13px);
    transform:scaleX(0); transform-origin:left;
    animation:sew 1.5s cubic-bezier(.6,0,.2,1) forwards;
  }
  @keyframes sew{to{transform:scaleX(1)}}

  button{
    font-family:var(--body); font-size:.8rem; letter-spacing:.2em;
    text-transform:uppercase; color:var(--bone); background:transparent;
    padding:.8rem 1.5rem; border:1px solid var(--thread); border-radius:0;
    cursor:pointer; transition:background .18s, color .18s, border-color .18s;
  }
  button:hover{background:var(--thread); color:var(--void)}
  button:focus-visible{outline:2px solid var(--diamond); outline-offset:3px}
  button[data-done]{border-color:var(--diamond); color:var(--diamond)}

  /* Las dos salidas de la puerta de movil, una debajo de otra en
     pantallas estrechas: en una sola fila el segundo boton — que es el
     largo — se salia por el lado. */
  .choices{display:flex; flex-wrap:wrap; gap:.8rem; justify-content:center}
  /* La segunda opcion no compite con la primera: copiar el link es lo
     que de verdad queremos que haga. */
  .quiet{border-color:var(--dim); color:var(--dim); opacity:.75}
  .quiet:hover{background:var(--dim); color:var(--void); opacity:1}

  /* ── Calendario ──────────────────────────────────────────────────
     Va en HTML de verdad, no dibujado en el lienzo. En el lienzo cada
     casilla era un contenedor con su area de clic calculada a mano, y
     eso trae problemas que aqui no existen: clics que no entran, celdas
     que se agrandan y tapan a la vecina, listas que hay que recortar y
     desplazar a mano. Un boton del navegador siempre se deja pulsar. */
  #cal{
    position:fixed; inset:0; z-index:8; display:none;
    align-items:center; justify-content:center; padding:1.2rem;
    background:rgba(8,6,14,.82); backdrop-filter:blur(2px);
  }
  #cal[data-on]{display:flex}
  .cal-box{
    background:#1b1a3a; border:2px solid var(--thread);
    box-shadow:0 18px 60px rgba(0,0,0,.6);
    padding:1.4rem 1.6rem; width:min(680px,96vw);
    max-height:94vh; overflow:auto; text-align:center;
  }
  .cal-title{
    font-family:var(--display); font-size:1.5rem; color:var(--bone);
    margin:0 0 .2rem; letter-spacing:.04em;
  }
  .cal-sub{font-size:.86rem; color:var(--dim); margin:0 0 1rem}
  .cal-grid{
    display:grid; grid-template-columns:repeat(auto-fit,minmax(86px,1fr));
    gap:.5rem; margin:0 0 .4rem;
  }
  .cal-day, .cal-slot{
    font-family:var(--body); font-size:.95rem; color:var(--bone);
    background:#2f2657; border:1px solid #5f5090; padding:.6rem .4rem;
    cursor:pointer; transition:background .14s, border-color .14s, transform .14s;
  }
  .cal-day:hover, .cal-slot:hover{background:#463a7a; transform:translateY(-2px)}
  .cal-day[aria-pressed="true"]{
    background:var(--gold); border-color:var(--gold); color:#241a06; font-weight:600;
  }
  .cal-day small{display:block; font-size:.7rem; opacity:.75; letter-spacing:.06em}
  .cal-slots{
    display:grid; grid-template-columns:repeat(auto-fit,minmax(76px,1fr));
    gap:.45rem; margin:.2rem 0 0; max-height:34vh; overflow:auto; padding:.2rem;
  }
  .cal-step{margin:1.1rem 0 .3rem; border-top:1px dashed var(--thread); padding-top:1rem}
  .cal-ask{font-family:var(--display); font-size:1.25rem; color:var(--gold); margin:0 0 .9rem}
  .cal-actions{display:flex; gap:.8rem; justify-content:center; flex-wrap:wrap}
  .cal-yes{border-color:var(--diamond); color:var(--diamond)}
  .cal-yes:hover{background:var(--diamond); color:var(--void)}
  .cal-hidden{display:none}

  @media (prefers-reduced-motion:reduce){
    .stitch::after{animation:none; transform:scaleX(1)}
    *{animation-duration:.01ms!important; transition-duration:.01ms!important}
  }
</style>
</head>
<body>

<div id="game" aria-label="Juego"></div>

<!-- Arranque: visible hasta que Phaser toma el control -->
<div class="gate" id="boot" data-on>
  <p class="eyebrow">Autoridad minera</p>
  <p class="headline">Preparando la expedición</p>
  <div class="stitch" aria-hidden="true"></div>
  <p class="meta" id="bootmeta">Cargando equipo insuficiente…</p>
</div>

<!-- Calendario. Lo rellena src/ui/CalendarDom.ts; vacío hasta entonces. -->
<div id="cal" role="dialog" aria-modal="true" aria-labelledby="caltitle"></div>

<!-- Puerta de móvil: el juego necesita teclado y ratón -->
<div class="gate" id="mobile" role="alertdialog" aria-labelledby="mtitle">
  <p class="eyebrow">Autoridad minera</p>
  <p class="headline" id="mtitle">Esto se juega en PC</p>
  <div class="stitch" aria-hidden="true"></div>
  <p class="body">Necesita teclado y mouse, y se juega en pantalla completa. Copia el link y ábrelo en una computadora.</p>
  <div class="choices">
    <button id="copy" type="button">Copiar el link</button>
    <button id="nope" type="button" class="quiet">No quiero jugar aquí</button>
  </div>
  <p class="meta" id="mmeta">Te esperamos. Tenemos tiempo.</p>
</div>

<script type="module">
  // La puerta de móvil vive aquí y no en Phaser: si el dispositivo no
  // sirve, no tiene sentido descargar ni arrancar el motor.
  const coarse = matchMedia("(pointer:coarse)").matches;
  const small = Math.min(innerWidth, innerHeight) < 720;

  if (coarse && small) {
    document.getElementById("boot").removeAttribute("data-on");
    document.getElementById("mobile").setAttribute("data-on", "");

    // El aviso de "alguien entro" se manda DESDE AQUI cuando es un movil.
    //
    // Lo normal es que lo mande el arranque del juego, pero en un
    // telefono el juego no llega a cargarse: esta misma puerta corta
    // antes de importar el motor. Resultado: entrar desde el movil no
    // avisaba de nada, y justo esos son los que necesitan que alguien se
    // entere para pasarles el link.
    //
    // Va en JavaScript pelado, sin tocar el paquete del juego: cargar
    // 190 KB de codigo en un telefono solo para mandar un aviso seria
    // absurdo cuando lo unico que hace falta es un `fetch`.
    try {
      const YA = "expedicion-diamante:opened";
      if (!sessionStorage.getItem(YA)) {
        sessionStorage.setItem(YA, "1");
        fetch("/api/game-open", {
          method: "POST",
          headers: { "content-type": "application/json" },
          keepalive: true,
          body: JSON.stringify({
            sessionId: Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 10),
            timestamp: new Date().toISOString(),
            localTime: new Date().toLocaleString(),
            userAgent: navigator.userAgent,
            platform: "mobile",
            viewport: { w: innerWidth, h: innerHeight },
            screen: { w: screen.width, h: screen.height },
            language: navigator.language,
            timezone: Intl.DateTimeFormat().resolvedOptions().timeZone,
            blocked: true,
          }),
        }).catch(() => { /* sin red: el aviso se pierde, la puerta sigue */ });
      }
    } catch { /* sin sessionStorage: mejor no avisar que avisar en bucle */ }

    const btn = document.getElementById("copy");
    btn.addEventListener("click", async () => {
      try {
        await navigator.clipboard.writeText(location.href);
      } catch {
        const ta = document.createElement("textarea");
        ta.value = location.href;
        ta.style.cssText = "position:fixed;opacity:0";
        document.body.appendChild(ta);
        ta.select();
        try { document.execCommand("copy"); } catch { /* se ignora */ }
        ta.remove();
      }
      btn.textContent = "Link copiado";
      btn.setAttribute("data-done", "");
    });

    // La otra salida. No lleva a ninguna parte a proposito: el juego
    // necesita teclado y raton, asi que lo unico que puede hacer es
    // decirlo con todas las letras en vez de dejar el boton muerto.
    const nope = document.getElementById("nope");
    nope.addEventListener("click", () => {
      document.getElementById("mtitle").textContent = "Sorry, es solo para PC";
      document.getElementById("mmeta").textContent =
        "En serio. Copia el link y nos vemos allá.";
      nope.remove();
    });
  } else {
    import("./src/main.ts").catch((err) => {
      console.error(err);
      document.getElementById("bootmeta").textContent =
        "Fallo al cargar. Recarga la página.";
    });
  }
</script>
</body>
</html>
